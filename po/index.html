            if (isShiny) {

            return {

          const startHiddenBattle = (mythicalId) => {

          const calculateDamage = (attacker, defender, move, attackerHp, defenderHp) => {
            const isCrit = Math.random() < 0.1 ? true : false; 
            let effectiveness = getEffectiveness(move.type, defender.type);
            
            let dmgMultiplier = 1;
            let attackerMsg = null, defenderMsg = null;
            let recoil = 0, heal = 0;

            if (attacker.ability) {
              if (attacker.ability === '잔비' && move.type === 'water') { dmgMultiplier *= 1.5; attackerMsg = '[잔비] 물타입 위력이 올랐다!'; }
              if (attacker.ability === '가뭄' && move.type === 'fire') { dmgMultiplier *= 1.5; attackerMsg = '[가뭄] 불꽃타입 위력이 올랐다!'; }
              if (attacker.ability === '시원의바다' && move.type === 'water') { dmgMultiplier *= 1.5; attackerMsg = '[시원의바다] 물타입 위력이 올랐다!'; }
              if (attacker.ability === '끝의대지' && move.type === 'fire') { dmgMultiplier *= 1.5; attackerMsg = '[끝의대지] 불꽃타입 위력이 올랐다!'; }
              if (attacker.ability === '페어리오라' && move.type === 'fairy') { dmgMultiplier *= 1.5; attackerMsg = '[페어리오라] 페어리 위력이 올랐다!'; }
              if (attacker.ability === '다크오라' && move.type === 'dark') { dmgMultiplier *= 1.5; attackerMsg = '[다크오라] 악타입 위력이 올랐다!'; }
              if (attacker.ability === '일렉트릭메이커' && move.type === 'electric') { dmgMultiplier *= 1.5; attackerMsg = '[일렉트릭메이커] 전기 위력이 올랐다!'; }
              if (attacker.ability === '델타스트림' && (move.type === 'flying' || move.type === 'dragon')) { dmgMultiplier *= 1.2; attackerMsg = '[델타스트림] 강력한 난기류가 기술의 위력을 높였다!'; }
              if (attacker.ability === '적응력') { dmgMultiplier *= 1.2; attackerMsg = '[적응력] 자속 기술의 위력이 올라갔다!'; }
              if (attacker.ability === '모래의힘' && (move.type === 'ground' || move.type === 'rock' || move.type === 'steel')) { dmgMultiplier *= 1.5; attackerMsg = '[모래의힘] 모래바람의 힘으로 위력이 올랐다!'; }
              if (attacker.ability === '불요의검') { dmgMultiplier *= 1.3; attackerMsg = '[불요의검] 검이 빛나며 공격력이 증가했다!'; }
              if (attacker.ability === '에어록') { dmgMultiplier *= 1.2; attackerMsg = '[에어록] 날씨를 무효화하고 위력을 높였다!'; }
              if ((attacker.ability === '터보블레이즈' || attacker.ability === '테라볼티지') && effectiveness < 1) { 
                dmgMultiplier *= 1.3; attackerMsg = `[${attacker.ability}] 상대방의 특성을 돌파하여 무시무시한 힘을 냈다!`; 
              }
              if (attacker.ability === '재생력' && Math.random() < 0.4) {
                heal = Math.floor(attacker.maxHp * 0.15); attackerMsg = '[재생력] 체력을 조금 회복했다!';
              }
              if (attacker.ability === '하늘의은총') {
                dmgMultiplier *= 1.2; attackerMsg = '[하늘의은총] 기술의 기운이 증폭되어 위력이 올랐다!';
              }
              if (attacker.ability === '승리의별') {
                dmgMultiplier *= 1.3; attackerMsg = '[승리의별] 승리의 기운으로 파괴력이 강화된다!';
              }
              if (attacker.ability === '정의의마음') {
                dmgMultiplier *= 1.2; attackerMsg = '[정의의마음] 투지가 타올라 공격력이 상승했다!';
              }
              if (attacker.ability === '매지션') {
                dmgMultiplier *= 1.2; attackerMsg = '[매지션] 신비한 마력으로 위력이 올랐다!';
              }
              if (attacker.ability === '브레인포스' && effectiveness >= 2) { 
                dmgMultiplier *= 1.25; attackerMsg = '[브레인포스] 약점을 찔러 위력이 더욱 상승했다!'; 
              }
              if (attacker.ability === '유대변화') {
                dmgMultiplier *= 1.3; attackerMsg = '[유대변화] 지우와의 깊은 유대로 전력을 다한다!';
              }
            }

            if (battleField) {
              if (battleField.effect === 'fire_up') {
                if (move.type === 'fire') { dmgMultiplier *= 1.5; attackerMsg = '🔥 가뭄 필드 속에서 불꽃의 위력이 폭증했다!'; }
                if (move.type === 'water') { dmgMultiplier *= 0.5; attackerMsg = '🔥 가뭄의 뜨거운 열기로 물의 힘이 억제되었다...'; }
              } else if (battleField.effect === 'water_up') {
                if (move.type === 'water') { dmgMultiplier *= 1.5; attackerMsg = '🌊 폭우 필드 속에서 폭발적인 수압이 몰아쳤다!'; }
                if (move.type === 'fire') { dmgMultiplier *= 0.5; attackerMsg = '🌊 폭우로 인해 불꽃의 불씨가 사그라들었다...'; }
              } else if (battleField.effect === 'electric_up') {
                if (move.type === 'electric') { dmgMultiplier *= 1.5; attackerMsg = '⚡ 일렉트릭필드의 대전 에너지로 정전기 위력이 격상했다!'; }
              } else if (battleField.effect === 'space_time') {
                if (Math.random() < 0.25) { dmgMultiplier *= 1.4; attackerMsg = '🌌 시공간의 에너지가 흡수되어 위력이 폭발적으로 상승했다!'; }
              }
            }

            let defenseVal = defender.defense || 10;
            if (defender.ability) {
              if (defender.ability === '잔비' && move.type === 'fire') { dmgMultiplier *= 0.5; defenderMsg = '[잔비] 불꽃 피해가 약화되었다!'; }
              if (defender.ability === '가뭄' && move.type === 'water') { dmgMultiplier *= 0.5; defenderMsg = '[가뭄] 물 피해가 약화되었다!'; }
              if (defender.ability === '시원의바다' && move.type === 'fire') { dmgMultiplier *= 0; defenderMsg = '[시원의바다] 불꽃 기술이 완전히 증발했다!'; }
              if (defender.ability === '끝의대지' && move.type === 'water') { dmgMultiplier *= 0; defenderMsg = '[끝의대지] 물 기술이 완전히 증발했다!'; }
              if ((defender.ability === '멀티스케일' || defender.ability === '스펙터가드') && defenderHp === defender.maxHp) {
                dmgMultiplier *= 0.5; defenderMsg = `[${defender.ability}] 피해를 반감시켰다!`;
              }
              if (defender.ability === '델타스트림' && effectiveness >= 2) { dmgMultiplier *= 0.5; defenderMsg = '[델타스트림] 난기류가 약점 피해를 반감시켰다!'; }
              if (defender.ability === '불굴의방패') { dmgMultiplier *= 0.7; defenderMsg = '[불굴의방패] 방패로 피해를 줄였다!'; }
              if (defender.ability === '프레셔' || defender.ability === '메탈프로텍트') { dmgMultiplier *= 0.9; }
              if (defender.ability === '오라브레이크' && (move.type === 'fairy' || move.type === 'dark')) { dmgMultiplier *= 0.5; defenderMsg = '[오라브레이크] 기술의 오라가 역전되었다!'; }
              if (defender.ability === '부유' && move.type === 'ground') { dmgMultiplier *= 0; defenderMsg = '[부유] 공중에 떠 있어 땅 타입 기술이 닿지 않는다!'; }
              if (defender.ability === '불굴의마음') { dmgMultiplier *= 0.8; }
              if (defender.ability === '탈' && Math.random() < 0.25) { dmgMultiplier *= 0; defenderMsg = '[탈] 인형이 공격을 대신 받아 피해가 없다!'; }
              if (defender.ability === '정전기' && Math.random() < 0.3) { recoil = Math.floor(attackerHp * 0.15); defenderMsg = '[정전기] 공격자가 마비성 피해를 입었다!'; }
              if (defender.ability === '불꽃몸' && Math.random() < 0.3) { recoil = Math.floor(attackerHp * 0.15); defenderMsg = '[불꽃몸] 공격자가 화상 피해를 입었다!'; }
              if (defender.ability === '멀티타입') { dmgMultiplier *= 0.8; defenderMsg = '[멀티타입] 아르세우스가 모든 타입의 데미지를 경감시켰다!'; }
              if (defender.ability === '프리즘아머' && effectiveness >= 2) { dmgMultiplier *= 0.75; defenderMsg = '[프리즘아머] 약점 피해를 줄여서 받았다!'; }
            }

            if (battleField && battleField.effect === 'snow' && defender.type === 'ice') {
              defenseVal = Math.floor(defenseVal * 1.5);
              defenderMsg = '❄️ 설원 필드 효과로 인해 얼음 타입 방어력이 올랐다!';
            }

            const levelFactor = (2 * attacker.level) / 5 + 2;
            const attackVal = attacker.attack || 10;
            const statRatio = attackVal / defenseVal;
            const movePower = move.power || 40;
            
            const baseDamage = ((levelFactor * movePower * statRatio) / 5) + 2;
            const randomMultiplier = 0.85 + Math.random() * 0.15;
            
            let finalDamage = Math.floor(baseDamage * randomMultiplier * effectiveness * dmgMultiplier);

            if (isCrit && finalDamage > 0) {
              finalDamage = Math.floor(finalDamage * 1.15);
            }

            if (drainMoves.includes(move.name) && finalDamage > 0) {
              let drainRatio = 0.5;
              if (move.name === '데스윙') drainRatio = 0.75; 
              if (move.name === '기가드레인') drainRatio = 0.25;
              heal = Math.floor(finalDamage * drainRatio);
              attackerMsg = `[${move.name}] 상대로부터 체력을 흡수했다!`;
            }

            return { damage: Math.max(0, finalDamage), isCrit, effectiveness, attackerMsg, defenderMsg, recoil, heal };
          };

          const applyFieldEndTurnEffects = async (playerCurrentHp, enemyCurrentHp) => {
            if (playerCurrentHp <= 0 || enemyCurrentHp <= 0) return { pHP: playerCurrentHp, eHP: enemyCurrentHp };
            if (!battleField || battleField.effect !== 'sandstorm') return { pHP: playerCurrentHp, eHP: enemyCurrentHp };

            let pDamage = 0, eDamage = 0, effectTriggered = false;
            const immuneTypes = ['rock', 'ground', 'steel'];

            if (!immuneTypes.includes(player.type)) { pDamage = Math.floor(player.maxHp * 0.06); effectTriggered = true; }
            if (!immuneTypes.includes(enemy.type)) { eDamage = Math.floor(enemy.maxHp * 0.06); effectTriggered = true; }

            if (effectTriggered) {
              setDialogue('🪨 모래바람이 거세게 불어 포켓몬들이 데미지를 입는다!');
              await sleep(1000);
            }
            return { pHP: Math.max(pDamage > 0 ? 1 : 0, playerCurrentHp - pDamage), eHP: Math.max(eDamage > 0 ? 1 : 0, enemyCurrentHp - eDamage) };
          };

          const enemyTurn = async () => {
            setIsAnimating(true);
            setMenuView('hidden');
            
            const randomMove = enemy.moves[Math.floor(Math.random() * enemy.moves.length)];
            setDialogue(`${currentTrainer.name}의 ${enemy.name}의 ${randomMove.name}!`);
            
            setEnemyAnim('-translate-x-6 translate-y-6 scale-110 transition-transform duration-200');
            await sleep(250);
            setEnemyAnim('transition-transform duration-300');
            
            setActiveEffect({ type: randomMove.type, target: 'player' });
            await sleep(400);
            setActiveEffect(null);

            setPlayerAnim('animate-pulse opacity-50 drop-shadow-[0_0_15px_rgba(255,0,0,0.8)]');
            
            const { damage, isCrit, effectiveness, attackerMsg, defenderMsg, recoil, heal } = calculateDamage(enemy, player, randomMove, enemyHpRef.current, playerHpRef.current);
            
            if (attackerMsg) { setDialogue(attackerMsg); await sleep(800); }
            let newHp = Math.max(0, playerHpRef.current - damage);
            updatePlayerHp(newHp);
            
            let tempEnemyHp = enemyHpRef.current;
            if (recoil > 0) { tempEnemyHp = Math.max(1, tempEnemyHp - recoil); updateEnemyHp(tempEnemyHp); }
            if (heal > 0) { tempEnemyHp = Math.min(enemy.maxHp, tempEnemyHp + heal); updateEnemyHp(tempEnemyHp); }
            if (defenderMsg) { setDialogue(defenderMsg); await sleep(800); }
            
            await sleep(300);
            setPlayerAnim('');
            
            if (effectiveness === 0) {
              setDialogue('효과가 없는 것 같다...'); await sleep(800);
            } else if (damage > 0) {
              if (isCrit) { setDialogue('급소에 맞았다!'); await sleep(800); }
              if (effectiveness >= 2) { setDialogue('효과가 굉장했다!'); await sleep(800); }
              else if (effectiveness <= 0.5) { setDialogue('효과가 별로인 듯하다...'); await sleep(800); }
            }

            const afterField = await applyFieldEndTurnEffects(newHp, tempEnemyHp);
            newHp = afterField.pHP;
            updatePlayerHp(newHp);
            updateEnemyHp(afterField.eHP);

            if (newHp <= 0) {
              setDialogue(`${player.name}(은)는 쓰러졌다...`);
              await sleep(1000);
              const newFainted = [...faintedPokemonIds, player.baseId];
              setFaintedPokemonIds(newFainted);
              setPartyHpPct(prev => ({...prev, [player.baseId]: 0}));

              const alivePokemon = Object.values(pokemonData).filter(p => 
                ((!p.isLegendary && p.unlockLevel <= playerLevel && !evolvedAway.includes(p.id) && !String(p.id).startsWith('M') && !String(p.id).startsWith('P') && !String(p.id).startsWith('B') && !String(p.id).startsWith('W') && !String(p.id).startsWith('D') && !String(p.id).startsWith('L') && !String(p.id).startsWith('C') && !String(p.id).startsWith('A')) || 
                ownedLegendaries.includes(p.id) || unlockedEvolutions.includes(p.id)) && !newFainted.includes(p.id)
              );

              if (alivePokemon.length === 0) setGameState('gameover');
              else { setDialogue('다음 포켓몬을 내보내야 한다!'); setGameState('pokemon_switch'); }
            } else {
              setDialogue(`무엇을 할까?`); setMenuView('main');
            }
            setIsAnimating(false);
          };

          const handleAttack = async (move) => {
            if (isAnimating) return; 
            setIsAnimating(true); setMenuView('hidden');
            
            setDialogue(`${player.name}(이)의 ${move.name}!`);
            setPlayerAnim('translate-x-6 -translate-y-6 scale-110 transition-transform duration-200');
            await sleep(250);
            setPlayerAnim('transition-transform duration-300');
            
            setActiveEffect({ type: move.type, target: 'enemy' });
            await sleep(400);
            setActiveEffect(null);
            
            setEnemyAnim('animate-pulse opacity-50 drop-shadow-[0_0_15px_rgba(255,0,0,0.8)]');
            
            const { damage, isCrit, effectiveness, attackerMsg, defenderMsg, recoil, heal } = calculateDamage(player, enemy, move, playerHpRef.current, enemyHpRef.current);

            let newHp = Math.max(0, enemyHpRef.current - damage);
            updateEnemyHp(newHp);
            
            let tempPlayerHp = playerHpRef.current;
            if (recoil > 0) { tempPlayerHp = Math.max(1, tempPlayerHp - recoil); updatePlayerHp(tempPlayerHp); }
            if (heal > 0) { tempPlayerHp = Math.min(player.maxHp, tempPlayerHp + heal); updatePlayerHp(tempPlayerHp); }
            if (defenderMsg) { setDialogue(defenderMsg); await sleep(800); }

            await sleep(300);
            setEnemyAnim('');
            
            if (effectiveness === 0) {
              setDialogue('효과가 없는 것 같다...'); await sleep(800);
            } else if (damage > 0) {
              if (isCrit) { setDialogue('급소에 맞았다!'); await sleep(800); }
              if (effectiveness >= 2) { setDialogue('효과가 굉장했다!'); await sleep(800); }
              else if (effectiveness <= 0.5) { setDialogue('효과가 별로인 듯하다...'); await sleep(800); }
            }

            const afterField = await applyFieldEndTurnEffects(tempPlayerHp, newHp);
            updatePlayerHp(afterField.pHP);
            newHp = afterField.eHP;
            updateEnemyHp(newHp);

            if (newHp <= 0) {
              setDialogue(`${currentTrainer.name}의 ${enemy.name}(이)가 쓰러졌다!`);

              if (enemyIndex + 1 < enemyParty.length) {
                  const nextEnemy = enemyParty[enemyIndex + 1];

                              let allAvailable = [];
                              for (let i = 1; i <= maxGen; i++) {
                                  if (legendaryByGen[i]) allAvailable = [...allAvailable, ...legendaryByGen[i].filter(id => !ownedLegendaries.includes(id))];
                              }
                              
                              if (allAvailable.length > 0) {
                                  const options = allAvailable.map(id => getScaledStats(pokemonData[id], playerLevel, Math.random() < 0.1));
                                  setLegendaryOptions(options); setGameState('legendary_select');
                              } else {
                                  setPendingLegendaryGen(null);
                                  startBattle(player, nextStage);
                              }
                            } else {
                              startBattle(player, nextStage);
                            }
                          }} className="py-3 px-4 bg-yellow-400 hover:bg-yellow-500 border-4 border-gray-800 rounded-lg text-gray-900 font-black text-lg transition-all shadow-[4px_4px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none">
                            {pendingLegendaryGen ? '전설 포켓몬 합류' : '다음 방 진입'}
                          </button>
                      )}
                    </div>
                  </div>
                </div>
              );
            }

            if (gameState === 'bp_shop') {
              const upgradeInfo = statUpgrades[selectedUpgradePokemonId] || { hp: 0, attack: 0, defense: 0 };
              const allMyPokemon = Object.values(pokemonData).filter(p => 
                (!p.isLegendary && p.unlockLevel <= playerLevel && !evolvedAway.includes(p.id) && !String(p.id).startsWith('M') && !String(p.id).startsWith('P') && !String(p.id).startsWith('B') && !String(p.id).startsWith('W') && !String(p.id).startsWith('D') && !String(p.id).startsWith('L') && !String(p.id).startsWith('C') && !String(p.id).startsWith('A')) || 
                ownedLegendaries.includes(p.id) || unlockedEvolutions.includes(p.id)
              );

              return (
                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-mono text-white">
                  <div className="max-w-lg w-full bg-gray-800 border-4 border-teal-500 rounded-xl p-6 shadow-2xl">
                    <div className="flex justify-between items-center mb-4 border-b-2 border-gray-700 pb-2">
                      <h2 className="text-2xl font-black text-teal-400">🧪 트레이너 도핑 연구소</h2>
                      <div className="bg-yellow-400 text-gray-900 font-bold px-3 py-1 rounded-full text-sm">{bp} BP 소지중</div>
                    </div>
                    <p className="text-gray-400 text-xs mb-4">획득한 BP로 포켓몬에게 강화 물약을 주입합니다.</p>
                    <div className="mb-4">
                      <label className="block text-xs font-bold text-teal-300 mb-1">대상 포켓몬 선택:</label>
                      <select className="w-full bg-gray-700 border-2 border-gray-600 rounded p-2 text-sm font-bold animate-pulse" value={selectedUpgradePokemonId || ''} onChange={(e) => setSelectedUpgradePokemonId(Number(e.target.value) || e.target.value)}>
                        {allMyPokemon.map(p => <option key={p.id} value={p.id} className="text-gray-900">{p.name} (현재 강화: HP+{statUpgrades[p.id]?.hp || 0}, 공격+{statUpgrades[p.id]?.attack || 0})</option>)}
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-3 mb-6">
                      <div className="bg-gray-900 p-3 border-2 border-gray-700 rounded-lg flex flex-col justify-between shadow-md">
                        <div><span className="text-green-400 font-bold text-sm">맥스업 (HP +20)</span><p className="text-xs font-bold text-yellow-300 mt-1">현재: +{upgradeInfo.hp}</p></div>
                        <button disabled={bp < 15} onClick={() => { playClickSound(); handleBuyUpgrade('hp'); }} className={`w-full mt-3 py-1 text-xs font-bold rounded ${bp >= 15 ? 'bg-green-500 hover:bg-green-600' : 'bg-gray-700 opacity-50'}`}>15 BP로 주입</button>
                      </div>
                      <div className="bg-gray-900 p-3 border-2 border-gray-700 rounded-lg flex flex-col justify-between shadow-md">
                        <div><span className="text-red-400 font-bold text-sm">타우린 (공격력 +5)</span><p className="text-xs font-bold text-yellow-300 mt-1">현재: +{upgradeInfo.attack}</p></div>
                        <button disabled={bp < 15} onClick={() => { playClickSound(); handleBuyUpgrade('attack'); }} className={`w-full mt-3 py-1 text-xs font-bold rounded ${bp >= 15 ? 'bg-red-500 hover:bg-red-600' : 'bg-gray-700 opacity-50'}`}>15 BP로 주입</button>
                      </div>
                      <div className="bg-gray-900 p-3 border-2 border-gray-700 rounded-lg flex flex-col justify-between shadow-md">
                        <div><span className="text-blue-400 font-bold text-sm">사포닌 (방어력 +5)</span><p className="text-xs font-bold text-yellow-300 mt-1">현재: +{upgradeInfo.defense}</p></div>
                        <button disabled={bp < 15} onClick={() => { playClickSound(); handleBuyUpgrade('defense'); }} className={`w-full mt-3 py-1 text-xs font-bold rounded ${bp >= 15 ? 'bg-blue-500 hover:bg-blue-600' : 'bg-gray-700 opacity-50'}`}>15 BP로 주입</button>
                      </div>
                      <div className="bg-gray-900 p-3 border-2 border-gray-700 rounded-lg flex flex-col justify-between shadow-md">
                        <div><span className="text-teal-400 font-bold text-sm">상처약 (+1개 구매)</span><p className="text-xs font-bold text-yellow-300 mt-1">소지: {potions}개</p></div>
                        <button disabled={bp < 10 || potions >= 5} onClick={() => { playClickSound(); handleBuyUpgrade('potion'); }} className={`w-full mt-3 py-1 text-xs font-bold rounded ${bp >= 10 && potions < 5 ? 'bg-teal-500 hover:bg-teal-600' : 'bg-gray-700 opacity-50'}`}>{potions >= 5 ? '가득 참' : '10 BP로 구매'}</button>
                      </div>
                    </div>
                    <button onClick={() => { playClickSound(); setGameState('stage_clear'); }} className="w-full py-3 bg-gray-700 hover:bg-gray-600 border-2 border-gray-500 rounded-lg font-bold">뒤로가기</button>
                  </div>
                </div>
              );
            }

            if (gameState === 'legendary_select') {
              return (
                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-mono">
                  <div className="max-w-2xl w-full bg-white border-8 border-gray-800 rounded-xl p-6 shadow-2xl">
                    <h1 className="text-2xl font-black text-center mb-4 text-purple-600 animate-bounce">전설의 포켓몬 출현!</h1>
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 mb-4 max-h-96 overflow-y-auto p-2">
                      {legendaryOptions.map(poke => (
                        <button key={poke.id} onClick={() => {
                            playClickSound();
                            if (poke.isShiny) setShinyList(prev => [...new Set([...prev, poke.id])]);
                            setOwnedLegendaries(prev => [...prev, poke.id]);
                            setPendingLegendaryGen(null);
                            startBattle(player, stage);
                          }} className="flex flex-col items-center p-3 border-4 border-gray-300 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all relative overflow-hidden">
                          {poke.isShiny && <div className="absolute inset-0 bg-yellow-200 opacity-20 animate-pulse rounded-lg"></div>}
                          <img src={poke.front} alt={poke.name} className="w-20 h-20 rendering-pixelated mb-2 relative z-10" />
                          <span className={`font-bold text-xs text-center relative z-10 ${poke.isShiny ? 'text-yellow-600' : 'text-gray-800'}`}>{poke.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              );
            }

            if (gameState === 'pokemon_switch') {
              const availablePokemon = Object.values(pokemonData).filter(p => 
                (!p.isLegendary && p.unlockLevel <= playerLevel && !evolvedAway.includes(p.id) && !String(p.id).startsWith('M') && !String(p.id).startsWith('P') && !String(p.id).startsWith('B') && !String(p.id).startsWith('W') && !String(p.id).startsWith('D') && !String(p.id).startsWith('L') && !String(p.id).startsWith('C') && !String(p.id).startsWith('A')) || 
                ownedLegendaries.includes(p.id) || unlockedEvolutions.includes(p.id)
              );

              const handleSelectPokemon = (basePoke) => {
                if (faintedPokemonIds.includes(basePoke.id)) return;
                if (player.baseId === basePoke.id && playerHpRef.current > 0) { setGameState('battle'); return; }
                
                const wasFainted = playerHpRef.current <= 0;
                if (playerHpRef.current > 0) setPartyHpPct(prev => ({...prev, [player.baseId]: playerHpRef.current / player.maxHp}));

                const scaledNewPlayer = getScaledStats(basePoke, playerLevel); 
                const pct = partyHpPct[basePoke.id] !== undefined ? partyHpPct[basePoke.id] : 1.0;
                const newHp = Math.max(1, Math.floor(scaledNewPlayer.maxHp * pct));
                
                setPlayer({ ...scaledNewPlayer, baseId: basePoke.id }); updatePlayerHp(newHp);
                
                if (wasFainted) setDialogue(`가라! ${scaledNewPlayer.name}!`); else setDialogue(`무엇을 할까?`);
                setMenuView('main'); setGameState('battle');
              };

              return (
                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-mono text-white">
                  <div className="max-w-md w-full bg-gray-800 border-4 border-gray-600 rounded-xl p-6 shadow-2xl">
                    <h2 className="text-2xl font-bold mb-6 text-center">{playerHpRef.current <= 0 ? '다음 포켓몬을 선택하세요!' : '포켓몬 교체'}</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6 max-h-96 overflow-y-auto p-2">
                      {availablePokemon.map(basePoke => {
                        const poke = getScaledStats(basePoke, playerLevel);
                        const isFainted = faintedPokemonIds.includes(poke.id);
                        const isCurrent = player.baseId === poke.id;
                        const pct = isCurrent ? (playerHpRef.current/player.maxHp) : (partyHpPct[poke.id] !== undefined ? partyHpPct[poke.id] : 1.0);

                        return (
                          <button key={poke.id} onClick={() => { playClickSound(); handleSelectPokemon(basePoke); }} disabled={isFainted || (isCurrent && playerHpRef.current <= 0)} className={`flex flex-col items-center p-2 border-2 rounded-lg transition-colors ${isCurrent && playerHpRef.current > 0 ? 'border-green-500 bg-green-900' : isFainted ? 'border-red-900 bg-red-950 opacity-50 cursor-not-allowed' : 'border-gray-500 bg-gray-700 hover:border-blue-400 hover:bg-blue-900'}`}>
                            <img src={poke.front} alt={poke.name} className={`w-16 h-16 rendering-pixelated ${isFainted ? 'grayscale opacity-50' : ''}`} />
                            <span className={`font-bold text-xs text-center ${poke.isShiny ? 'text-yellow-400' : 'text-gray-200'}`}>{poke.name}</span>
                            <div className="w-full bg-gray-900 h-2 mt-2 rounded-full overflow-hidden border border-gray-700">
                              <div className={`h-full ${pct > 0.5 ? 'bg-green-500' : pct > 0.2 ? 'bg-yellow-500' : 'bg-red-500'}`} style={{ width: `${pct * 100}%` }}></div>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                    {playerHpRef.current > 0 && <button onClick={() => { playClickSound(); setGameState('battle'); }} className={buttonClass}>배틀로 돌아가기</button>}
                  </div>
                </div>
              );
            }

            if (gameState === 'gameover') {
              return (
                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-mono text-white">
                  <div className="text-center">
                    <h2 className="text-4xl font-bold mb-8 text-red-500">배틀 종료!</h2>
                    <div className="flex justify-center items-end gap-8 mb-8 grayscale opacity-50">
                      <img src={player.front} alt="player" className="w-32 h-32 rendering-pixelated" />
                    </div>
                    <p className="text-2xl mb-4 font-bold">도달 스테이지 : {stage}</p>
                    <p className="text-xl mb-8 text-gray-400">포켓몬이 모두 기절했다...<br/>서둘러 포켓몬 센터로 가야 합니다!</p>
                    <button onClick={() => { playClickSound(); setGameState('start'); }} className={buttonClass}>처음부터 다시하기</button>
                  </div>
                </div>
              );
            }

            if (gameState === 'game_clear_choice') {
              return (
                <div className="min-h-screen bg-yellow-100 flex items-center justify-center p-4 font-mono text-gray-800">
                  <div className="text-center bg-white p-10 rounded-2xl border-8 border-yellow-400 shadow-2xl max-w-lg w-full relative overflow-hidden">
                    <h2 className="text-4xl font-black mb-6 text-yellow-500 drop-shadow-[2px_2px_0_rgba(0,0,0,1)] relative z-10">🎉 챔피언 등극! 🎉</h2>
                    <p className="text-xl mb-4 font-black text-purple-600 relative z-10">무패의 챔피언 단델을 꺾었습니다!</p>
                    <p className="text-md mb-8 text-gray-700 font-bold relative z-10">이제 명예의 전당에 이름을 새길 수 있습니다.<br/>하지만... 미지의 시련이 당신을 부르고 있습니다.</p>
                    <div className="flex flex-col gap-4 relative z-10">
                      <button onClick={() => { playClickSound(); setGameState('master_select'); }} className="w-full py-3 px-4 bg-yellow-400 border-4 border-yellow-600 rounded-lg font-black text-gray-900 shadow-[4px_4px_0_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 text-lg">명예의 전당 등록 (엔딩)</button>
                      <button onClick={() => { 
                          playClickSound(); 
                          setStage(46); 
                          updatePlayerHp(player.maxHp);
                          setPotions(5);
                          setPartyHpPct({}); setFaintedPokemonIds([]);
                          startBattle(player, 46); 
                      }} className="w-full py-3 px-4 bg-red-600 border-4 border-red-800 rounded-lg font-black text-white shadow-[4px_4px_0_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 animate-pulse text-lg">마지막 시련 도전 (VS 지우)</button>
                    </div>
                  </div>
                </div>
              );
            }

            if (gameState === 'game_clear') {
              const isTrueEnding = stage === 46;
              return (
                <div className="min-h-screen bg-yellow-100 flex items-center justify-center p-4 font-mono text-gray-800">
                  <div className="text-center bg-white p-10 rounded-2xl border-8 border-yellow-400 shadow-2xl max-w-lg w-full relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-full pointer-events-none flex justify-center items-center opacity-20">
                       <div className="w-64 h-64 bg-yellow-400 rounded-full animate-ping"></div>
                    </div>
                    <h2 className="text-4xl font-black mb-6 text-yellow-500 drop-shadow-[2px_2px_0_rgba(0,0,0,1)] relative z-10">
                      {isTrueEnding ? '🌟 진정한 마스터 🌟' : '🎉 챔피언 등극! 🎉'}
                    </h2>
                    <div className="flex justify-center mb-6 relative z-10">
                      <img src={player.front} alt="player" className="w-40 h-40 rendering-pixelated animate-bounce drop-shadow-xl" />
                    </div>
                    <p className="text-2xl mb-4 font-black text-purple-600 relative z-10">
                      {isTrueEnding ? '전설적인 트레이너 지우를 꺾었습니다!' : '무패의 챔피언 단델을 꺾었습니다!'}
                    </p>
                    {isTrueEnding && <p className="text-red-500 font-bold animate-pulse text-lg mb-2 relative z-10">• 영원한 유대의 증표 [지우의 모자] 획득!</p>}
                    <p className="text-lg mb-8 text-gray-700 font-bold relative z-10">
                      모든 시련을 이겨낸 당신은<br/>세계 최강의 포켓몬 마스터입니다!
                    </p>
                    <button onClick={() => { playClickSound(); setGameState('master_select'); }} className={`relative z-10 ${buttonClass}`}>다음 회차의 파트너 선택하기</button>
                  </div>
                </div>
              );
            }

            if (gameState === 'master_select') {
              const availablePokemon = Object.values(pokemonData).filter(p => 
                (!p.isLegendary && p.unlockLevel <= playerLevel && !evolvedAway.includes(p.id) && !String(p.id).startsWith('M') && !String(p.id).startsWith('P') && !String(p.id).startsWith('B') && !String(p.id).startsWith('W') && !String(p.id).startsWith('D') && !String(p.id).startsWith('L') && !String(p.id).startsWith('C') && !String(p.id).startsWith('A')) || 
                ownedLegendaries.includes(p.id) || unlockedEvolutions.includes(p.id)
              );

              return (
                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 font-mono text-white">
                  <div className="max-w-3xl w-full bg-yellow-900 border-4 border-yellow-500 rounded-xl p-6 shadow-2xl">
                    <h2 className="text-3xl font-black mb-4 text-center text-yellow-400 drop-shadow-md">명예의 전당 등록</h2>
                    <p className="text-center text-gray-200 mb-6 font-bold leading-relaxed">
                      챔피언 등극을 축하합니다!<br/>새로운 모험(다음 회차)에 데려갈 포켓몬을 딱 한 마리만 골라주세요.<br/>
                      선택된 포켓몬은 영광스러운 <span className="text-yellow-300">포켓몬 마스터</span> 칭호를 얻고 1스테이지부터 파티에 합류합니다!
                    </p>
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 mb-4 max-h-96 overflow-y-auto p-3 bg-gray-800 rounded-lg border-2 border-gray-600">
                      {availablePokemon.map(basePoke => {
                        const poke = getScaledStats(basePoke, playerLevel);
                        const isAlreadyMaster = masterPokemonIds.includes(poke.id);
                        return (
                          <button key={poke.id} onClick={() => {
                            playClickSound();
                            if (!masterPokemonIds.includes(poke.id)) {
                              setMasterPokemonIds(prev => [...prev, poke.id]);
                            }
                            setGameState('start');
                          }} disabled={isAlreadyMaster} className={`flex flex-col items-center p-2 border-2 rounded-lg transition-colors ${isAlreadyMaster ? 'border-gray-500 bg-gray-700 opacity-50 cursor-not-allowed' : 'border-yellow-500 bg-gray-700 hover:border-yellow-400 hover:bg-gray-600 shadow-md active:translate-y-1'}`}>
                            <img src={poke.front} alt={poke.name} className="w-16 h-16 rendering-pixelated" />
                            <span className={`font-bold text-[11px] sm:text-xs text-center mt-1 break-keep ${poke.isShiny ? 'text-yellow-400' : 'text-gray-200'}`}>{pokemonData[poke.id].name}</span>
                            {isAlreadyMaster && <span className="text-[10px] text-red-400 mt-1 font-bold">이미 마스터</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            }

            return (
              <div className="min-h-screen bg-gray-900 flex items-center justify-center p-2 sm:p-4 font-mono select-none overflow-hidden relative">
                <div style={{ transform: `scale(${zoom})`, transformOrigin: 'center' }} className="w-full max-w-lg bg-gray-200 border-x-8 border-t-8 border-b-[24px] border-gray-300 rounded-t-3xl rounded-b-[40px] shadow-2xl overflow-hidden relative pb-12 transition-transform duration-300">
                  <div className="w-full h-8 bg-red-600 border-b-4 border-red-800 flex items-center px-4 mb-2">
                    <div className="w-4 h-4 bg-red-400 rounded-full border-2 border-red-800 mr-2"></div>
                    <div className="w-4 h-4 bg-yellow-400 rounded-full border-2 border-yellow-600 mr-2"></div>
                    <div className="w-4 h-4 bg-green-400 rounded-full border-2 border-green-600"></div>
                    <div className="ml-auto text-white font-bold text-xs bg-red-800 px-2 py-1 rounded flex items-center gap-2">
                      <span>BP: {bp}</span><span>STAGE {stage}</span>
                    </div>
                  </div>

                  {battleField && (
                    <div className="mx-4 mb-1.5 px-3 py-1 bg-teal-900/90 text-teal-200 rounded-lg border-2 border-teal-500 flex items-center justify-between text-xs font-bold animate-pulse">
                      <span>현재 필드: {battleField.name}</span><span className="text-[10px] text-teal-300 font-normal">{battleField.desc}</span>
                    </div>
                  )}

                  <div className="bg-white mx-4 border-4 border-gray-800 rounded-lg overflow-hidden relative">
                    <div className="h-64 bg-gradient-to-b from-blue-200 to-green-300 relative overflow-hidden">
                      <div className="absolute top-4 left-4 right-4 flex justify-between items-start">
                        <div className="bg-white/90 border-2 border-gray-800 p-2 rounded-lg w-48 shadow-md rounded-br-2xl relative">
                          <div className={`font-black text-[10px] mb-1 ${currentTrainer.color}`}>{currentTrainer.name}</div>
                          <div className="flex justify-between font-bold text-sm items-center">
                            <div className="flex items-center gap-1">
                              <span className={enemy.isShiny ? 'text-yellow-600' : ''}>{enemy.name}</span>
                              <span className={`text-[9px] px-1 py-0.5 rounded-sm border-2 ${getTypeColor(enemy.type)} leading-none`}>{typeKoreanMap[enemy.type]}</span>
                            </div>
                            <span>Lv.{enemy.level}</span>
                          </div>
                          <HealthBar current={enemyHp} max={enemy.maxHp} />
                          {enemyParty.length > 1 && (
                            <div className="flex gap-1 mt-1.5 justify-end">
                              {enemyParty.map((_, idx) => (
                                <div key={idx} className={`w-3 h-3 rounded-full border border-gray-800 shadow-sm overflow-hidden ${idx < enemyIndex ? 'bg-gray-400' : 'bg-red-500'}`}><div className="w-full h-1/2 bg-white/40"></div></div>
                              ))}
                            </div>
                          )}
                        </div>
                        <div className="relative w-32 h-32 flex justify-center items-end mt-4">
                          <div className="absolute bottom-2 w-20 h-4 bg-black/20 rounded-[50%]"></div>
                          
                          {currentTrainer.sprite && currentTrainer.type !== 'hidden' && (
                            <img 
                              src={currentTrainer.sprite} 
                              alt={currentTrainer.name} 
                              className={`absolute -top-3 right-0 w-24 h-24 object-contain rendering-pixelated z-0 transition-opacity duration-300 ${enemyHp <= 0 ? 'opacity-40 grayscale' : 'opacity-100'}`} 
                            />
                          )}

                          <div className={`relative z-10 w-full h-full flex justify-center items-end ${checkIsFloating(enemy) ? 'mb-4' : '-mb-2'}`}>
                            <img src={enemy.front} alt="Enemy" className={`w-32 h-32 object-contain rendering-pixelated ${enemyAnim} ${enemyHp <= 0 ? 'opacity-0 translate-y-10 transition-all duration-200' : ''}`} style={{ imageRendering: 'pixelated' }} />
                          </div>
                          {activeEffect && activeEffect.target === 'enemy' && (
                            <div className="absolute inset-0 flex items-center justify-center z-50 animate-ping text-6xl drop-shadow-[0_0_10px_rgba(255,255,255,1)]">
                              {effectVisuals[activeEffect.type] || '💢'}
                            </div>
                          )}
                        </div>
                      </div>
                      <div className="absolute bottom-2 left-4 right-4 flex justify-between items-end">
                        <div className="relative w-32 h-32 flex justify-center items-end">
                           <div className="absolute bottom-0 w-24 h-5 bg-black/20 rounded-[50%]"></div>
                           <div className={`relative z-10 w-full h-full flex justify-center items-end ${checkIsFloating(player) ? 'mb-4' : '-mb-4'}`}>
                             <img src={player.back} alt="Player" className={`w-40 h-40 max-w-none object-contain rendering-pixelated ${playerAnim} ${playerHp <= 0 ? 'opacity-0 translate-y-10 transition-all duration-200' : ''}`} style={{ imageRendering: 'pixelated' }} />
                           </div>
                           {activeEffect && activeEffect.target === 'player' && (
                            <div className="absolute inset-0 flex items-center justify-center z-50 animate-ping text-6xl drop-shadow-[0_0_10px_rgba(255,255,255,1)]">
                              {effectVisuals[activeEffect.type] || '💢'}
                            </div>
                           )}
                        </div>
                        <div className="bg-white/90 border-2 border-gray-800 p-2 rounded-lg w-48 shadow-md rounded-tl-2xl mb-4">
                          <div className="flex justify-between font-bold text-sm items-center">
                            <div className="flex items-center gap-1">
                              <span className={player.isShiny ? 'text-yellow-600' : ''}>{player.name}</span>
                              <span className={`text-[9px] px-1 py-0.5 rounded-sm border-2 ${getTypeColor(player.type)} leading-none`}>{typeKoreanMap[player.type]}</span>
                            </div>
                            <span>Lv.{playerLevel}</span>
                          </div>
                          <HealthBar current={playerHp} max={player.maxHp} />
                          <div className="text-right text-xs font-bold mt-1 text-gray-700">{playerHp} / {player.maxHp}</div>
                        </div>
                      </div>
                    </div>
                    <div className="h-32 bg-white border-t-4 border-gray-800 p-2 flex">
                      <div className={`border-4 border-double border-gray-600 rounded-lg p-3 bg-gray-50 flex-grow font-bold text-gray-800 text-lg sm:text-xl leading-relaxed flex items-center ${menuView !== 'hidden' ? 'w-1/2 mr-2' : 'w-full'}`}>
                        {dialogue}
                      </div>
                      {menuView === 'main' && !isAnimating && (
                        <div className="w-1/2 flex flex-col gap-2">
                          <div className="grid grid-cols-2 gap-2">
                            <button onClick={() => { playClickSound(); setMenuView('fight'); }} className="bg-red-50 border-2 border-red-500 rounded-lg font-bold text-red-700 hover:bg-red-100 transition-colors shadow-sm active:translate-y-1">싸운다</button>
                            <button onClick={() => { playClickSound(); handleItem(); }} className="bg-blue-50 border-2 border-blue-500 rounded-lg font-bold text-blue-700 hover:bg-blue-100 transition-colors shadow-sm active:translate-y-1 flex flex-col items-center justify-center"><span>가방</span><span className="text-xs font-normal">(상처약 x{potions})</span></button>
                            <button onClick={() => { playClickSound(); setGameState('pokemon_switch'); }} className="bg-green-50 border-2 border-green-500 rounded-lg font-bold text-green-700 hover:bg-green-100 transition-colors shadow-sm active:translate-y-1">포켓몬</button>
                            <button onClick={() => { playClickSound(); handleRun(); }} className="bg-yellow-50 border-2 border-yellow-500 rounded-lg font-bold text-yellow-700 hover:bg-yellow-100 transition-colors shadow-sm active:translate-y-1">도망친다</button>
                          </div>
                          {canMegaEvolve && <button onClick={() => { playClickSound(); handleMegaEvolveClick(); }} className="w-full bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 text-white font-black py-1.5 rounded-lg border-2 border-purple-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">메가진화 (키스톤 소모)</button>}
                          {canPrimalRevert && <button onClick={() => { playClickSound(); handlePrimalRevertClick(); }} className="w-full bg-gradient-to-r from-blue-500 via-yellow-500 to-red-500 text-white font-black py-1.5 rounded-lg border-2 border-yellow-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">원시회귀 (구슬 소모)</button>}
                          {canFuseKyurem && <button onClick={() => { playClickSound(); handleFusionClick('kyurem'); }} className="w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-gray-500 text-white font-black py-1.5 rounded-lg border-2 border-cyan-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">합체 (유전자쐐기 소모)</button>}
                          {canFuseNecrozma && <button onClick={() => { playClickSound(); handleFusionClick('necrozma'); }} className="w-full bg-gradient-to-r from-yellow-500 via-orange-500 to-purple-500 text-white font-black py-1.5 rounded-lg border-2 border-yellow-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">합체 (네크로플러스 소모)</button>}
                          {canCrownedZacian && <button onClick={() => { playClickSound(); executeCrowned('C888'); }} className="w-full bg-gradient-to-r from-blue-400 via-teal-500 to-indigo-500 text-white font-black py-1.5 rounded-lg border-2 border-blue-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">검왕 폼체인지 (녹슨 검 소모)</button>}
                          {canCrownedZamazenta && <button onClick={() => { playClickSound(); executeCrowned('C889'); }} className="w-full bg-gradient-to-r from-red-500 via-pink-600 to-purple-600 text-white font-black py-1.5 rounded-lg border-2 border-red-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">방패왕 폼체인지 (녹슨 방패 소모)</button>}
                          {canAwakenKeldeo && <button onClick={() => { playClickSound(); executeAwaken('R647'); }} className="w-full bg-gradient-to-r from-blue-400 via-cyan-500 to-blue-600 text-white font-black py-1.5 rounded-lg border-2 border-cyan-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">각오의 모습 (신비의칼 소모)</button>}
                          {canAwakenMeloetta && <button onClick={() => { playClickSound(); executeAwaken('P648'); }} className="w-full bg-gradient-to-r from-pink-400 via-rose-500 to-red-400 text-white font-black py-1.5 rounded-lg border-2 border-pink-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">스텝폼 (옛노래 소모)</button>}
                          {canAwakenHoopa && <button onClick={() => { playClickSound(); executeAwaken('U720'); }} className="w-full bg-gradient-to-r from-purple-500 via-fuchsia-600 to-indigo-600 text-white font-black py-1.5 rounded-lg border-2 border-purple-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">굴레를 벗어난 후파 (굴레의항아 소모)</button>}
                          {canOriginDialga && <button onClick={() => { playClickSound(); executeOriginRevert('O483'); }} className="w-full bg-gradient-to-r from-blue-500 via-indigo-600 to-gray-500 text-white font-black py-1.5 rounded-lg border-2 border-indigo-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">오리진폼 (큰금강옥 소모)</button>}
                          {canOriginPalkia && <button onClick={() => { playClickSound(); executeOriginRevert('O484'); }} className="w-full bg-gradient-to-r from-pink-500 via-purple-600 to-rose-500 text-white font-black py-1.5 rounded-lg border-2 border-purple-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">오리진폼 (큰백옥 소모)</button>}
                          {canOriginGiratina && <button onClick={() => { playClickSound(); executeOriginRevert('O487'); }} className="w-full bg-gradient-to-r from-purple-700 via-gray-600 to-red-700 text-white font-black py-1.5 rounded-lg border-2 border-gray-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">오리진폼 (백금옥 소모)</button>}
                          {canUltraBurst && <button onClick={() => { playClickSound(); executeUltraBurst('U800'); }} className="w-full bg-gradient-to-r from-yellow-300 via-yellow-500 to-orange-500 text-white font-black py-1.5 rounded-lg border-2 border-yellow-700 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">울트라버스트 (Z크리스탈 소모)</button>}
                          {canAshTransform && (
                              <button onClick={() => { playClickSound(); executeAshTransform(player.baseId === 25 ? 'A25' : 'A658'); }} className="w-full bg-gradient-to-r from-red-500 via-yellow-400 to-blue-500 text-white font-black py-1.5 rounded-lg border-2 border-red-900 shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none animate-pulse text-sm sm:text-base">유대변화 (지우의 모자 소모)</button>
                          )}
                        </div>
                      )}
                      {menuView === 'run_confirm' && !isAnimating && (
                        <div className="w-1/2 flex flex-col gap-2 relative">
                          <button onClick={() => { playClickSound(); executeRunConfirmed(); }} className="w-full bg-red-50 border-2 border-red-500 rounded-lg font-bold text-red-700 hover:bg-red-100 transition-colors shadow-sm active:translate-y-1 py-3 text-sm">그럼에도 도망친다</button>
                          <button onClick={() => { playClickSound(); setDialogue(`무엇을 할까?`); setMenuView('main'); }} className="w-full bg-gray-50 border-2 border-gray-500 rounded-lg font-bold text-gray-700 hover:bg-gray-100 transition-colors shadow-sm active:translate-y-1 py-3 text-sm">취소하고 싸운다</button>
                        </div>
                      )}
                      {menuView === 'fight' && !isAnimating && (
                        <div className="w-1/2 grid grid-cols-2 gap-2 relative">
                          {player.moves.map((move, idx) => (
                            <button key={idx} onClick={() => { playClickSound(); handleAttack(move); }} className={`${getTypeColor(move.type)} border-2 rounded-lg font-bold hover:brightness-110 transition-all shadow-sm active:translate-y-1 text-sm sm:text-base flex flex-col items-center justify-center py-1`}>
                              <span>{move.name}</span><span className="text-[10px] sm:text-xs font-normal opacity-90">{typeKoreanMap[move.type]} / 위력:{move.power}</span>
                            </button>
                          ))}
                          <button onClick={() => { playClickSound(); setMenuView('main'); }} className="absolute -top-10 right-0 bg-white border-2 border-gray-800 px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-200 shadow-[2px_2px_0_0_rgba(0,0,0,1)]">취소</button>
                        </div>
                      )}
                      {menuView === 'mega_select' && !isAnimating && (
                        <div className="w-1/2 flex gap-2 justify-center relative">
                          {megaSelectOptions.map(mId => (
                             <button key={mId} onClick={() => { playClickSound(); executeMegaEvolution(mId); }} className="flex-1 bg-purple-50 border-2 border-purple-500 rounded-lg p-2 font-bold text-purple-800 hover:bg-purple-100 shadow-sm active:translate-y-1 text-center flex flex-col items-center justify-center">
                                <span className="text-sm sm:text-base">{pokemonData[mId].name}</span><div className="text-[10px] sm:text-xs font-normal text-gray-500 font-sans mt-1">{pokemonData[mId].type.toUpperCase()} / 메가스톤 소모</div>
                             </button>
                          ))}
                          <button onClick={() => { playClickSound(); setMenuView('main'); }} className="absolute -top-10 right-0 bg-white border-2 border-gray-800 px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-200 shadow-[2px_2px_0_0_rgba(0,0,0,1)]">취소</button>
                        </div>
                      )}
                      {menuView === 'fusion_select' && !isAnimating && (
                        <div className="w-1/2 flex gap-2 justify-center relative">
                          {fusionSelectOptions.map(fId => (
                             <button key={fId} onClick={() => { playClickSound(); executeFusion(fId); }} className="flex-1 bg-indigo-50 border-2 border-indigo-500 rounded-lg p-2 font-bold text-indigo-800 hover:bg-indigo-100 shadow-sm active:translate-y-1 text-center flex flex-col items-center justify-center">
                                <span className="text-sm sm:text-base">{pokemonData[fId].name}</span><div className="text-[10px] sm:text-xs font-normal text-gray-500 font-sans mt-1">합체 아이템 소모</div>
                             </button>
                          ))}
                          <button onClick={() => { playClickSound(); setMenuView('main'); }} className="absolute -top-10 right-0 bg-white border-2 border-gray-800 px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-200 shadow-[2px_2px_0_0_rgba(0,0,0,1)]">취소</button>
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="absolute bottom-4 right-6 flex gap-2 rotate-45">
                    <div className="w-1 h-6 bg-gray-400 rounded-full"></div>
                    <div className="w-1 h-6 bg-gray-400 rounded-full"></div>
                    <div className="w-1 h-6 bg-gray-400 rounded-full"></div>
                    <div className="w-1 h-6 bg-gray-400 rounded-full"></div>
                  </div>
                </div>
              </div>
            );
          };

          return (
            <>
              <audio ref={bgmRef} src={currentBgmSrc} loop />

              <div className="fixed top-4 right-4 sm:top-6 sm:right-6 z-[9999] flex gap-2">
                <button onClick={() => { playClickSound(); toggleBgm(); }} className="bg-black/60 text-white px-3 py-1.5 rounded-lg font-bold shadow-lg hover:bg-black transition-colors border-2 border-gray-600">
                  {bgmOn ? '🔊 BGM' : '🔇 BGM'}
                </button>
                <button onClick={() => setZoom(z => Math.max(0.5, z - 0.1))} className="bg-black/60 text-white px-3 py-1.5 rounded-lg font-bold shadow-lg hover:bg-black transition-colors border-2 border-gray-600">🔍 -</button>
                <button onClick={() => setZoom(z => Math.min(2.0, z + 0.1))} className="bg-black/60 text-white px-3 py-1.5 rounded-lg font-bold shadow-lg hover:bg-black transition-colors border-2 border-gray-600">🔍 +</button>
              </div>

              {renderGameScreen()}
            </>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
