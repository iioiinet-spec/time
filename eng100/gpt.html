const cats=["전체","인사","학교","친구","취미","식당"]; let filter="전체",idx=0;
let saved;try{saved=JSON.parse(localStorage.getItem("seyengEnglish100")||'{"done":[],"streak":0}')}catch(e){saved={"done":[],"streak":0}} if(!Array.isArray(saved.done))saved.done=[];
const $=s=>document.querySelector(s), arr=()=>filter==="전체"?lessons:lessons.filter(x=>x.category===filter), cur=()=>arr()[idx]||arr()[0];
function store(){localStorage.setItem("seyengEnglish100",JSON.stringify(saved))}
function tabs(){$("#tabs").innerHTML=cats.map(c=>`<button class="btn whitespace-nowrap ${filter===c?"active":""}" data-c="${c}">${c}</button>`).join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{filter=b.dataset.c;idx=0;tabs();render()})}
function progress(){let n=saved.done.length;$("#count").textContent=n;$("#progressText").textContent=`${n} / 100`;$("#progress").style.width=n+"%";$("#streak").textContent=`연속 정답 ${saved.streak}`;$("#streak2").textContent=saved.streak}
function list(){$("#list").innerHTML=arr().map((x,i)=>`<button data-i="${i}" class="w-full text-left border-2 ${i===idx?"border-violet-400 bg-violet-50":"border-slate-100"} rounded-xl p-3"><b>${x.id}. ${x.en}</b><div class="text-xs text-slate-500 mt-1">${x.ko}</div>${saved.done.includes(x.id)?'<span class="text-xs text-emerald-600 font-black">완료</span>':''}</button>`).join("");document.querySelectorAll("#list button").forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render();window.scrollTo({top:180,behavior:"smooth"})})}
function render(){let x=cur();$("#meta").textContent=`${x.id} / 100 · ${x.category}`;$("#en").textContent=x.en;$("#ko").textContent=x.ko;$("#persona").textContent="상황: "+x.persona;$("#done").textContent=saved.done.includes(x.id)?"완료됨":"학습 완료";$("#chat").innerHTML=`<div class="flex gap-2"><b class="bg-violet-600 text-white rounded-full w-10 h-10 flex items-center justify-center">AI</b><div class="bg-white rounded-2xl p-3 font-bold">${x.ai}</div></div>`;$("#input").value="";quiz();list();progress()}
function speak(){if(!("speechSynthesis" in window))return alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur().en);u.lang="en-US";u.rate=.85;$("#listen").textContent="PLAYING";u.onend=()=>$("#listen").textContent="LISTEN";u.onerror=()=>$("#listen").textContent="LISTEN";speechSynthesis.speak(u)}
function celebrate(){let colors=["#7c3aed","#38bdf8","#f59e0b","#10b981","#ec4899"];for(let i=0;i<40;i++){let d=document.createElement("i");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=colors[i%colors.length];d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}}
function safe(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(s){return s.toLowerCase().replace(/[.,!?']/g,"").replace(/\s+/g," ").trim()}
function addChat(me,text,ok=false){let d=document.createElement("div");d.className="flex gap-2 "+(me?"justify-end":"");d.innerHTML=me?`<div class="bg-sky-500 text-white rounded-2xl p-3 font-bold">${safe(text)}</div><b class="bg-sky-600 text-white rounded-full w-10 h-10 flex items-center justify-center">ME</b>`:`<b class="${ok?"bg-emerald-500":"bg-violet-600"} text-white rounded-full w-10 h-10 flex items-center justify-center">AI</b><div class="bg-white rounded-2xl p-3 font-bold">${text}</div>`;$("#chat").appendChild(d)}
function answer(){let v=$("#input").value.trim();if(!v)return;addChat(true,v);$("#input").value="";let ok=cur().answers.some(a=>norm(v).includes(norm(a)));setTimeout(()=>{if(ok){addChat(false,"Excellent! 자연스럽고 좋은 대답입니다.",true);celebrate();if(!saved.done.includes(cur().id))saved.done.push(cur().id);store();progress();list()}else addChat(false,"좋은 시도입니다. 예문을 다시 듣고 핵심 표현을 넣어 다시 말해 보세요.")},200)}
function quiz(){let x=cur(),wrong=lessons.filter(y=>y.id!==x.id).sort(()=>Math.random()-.5).slice(0,3).map(y=>y.ko),opts=[x.ko,...wrong].sort(()=>Math.random()-.5);$("#q").textContent=`"${x.en}"의 뜻은?`;$("#choices").innerHTML=opts.map(o=>`<button class="btn text-left" data-ok="${o===x.ko}">${o}</button>`).join("");document.querySelectorAll("#choices button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#choices button").forEach(z=>z.disabled=true);if(b.dataset.ok==="true"){b.style.background="#dcfce7";saved.streak++;celebrate()}else{b.style.background="#fee2e2";saved.streak=0;document.querySelector('#choices button[data-ok="true"]').style.background="#dcfce7"}store();progress();setTimeout(quiz,1000)})}
$("#listen").onclick=speak;$("#prev").onclick=()=>{idx=(idx-1+arr().length)%arr().length;render()};$("#next").onclick=()=>{idx=(idx+1)%arr().length;render()};$("#done").onclick=()=>{if(!saved.done.includes(cur().id)){saved.done.push(cur().id);store();celebrate()}render()};$("#send").onclick=answer;$("#input").onkeydown=e=>{if(e.key==="Enter")answer()};$("#reset").onclick=()=>{if(confirm("학습 기록을 초기화할까요?")){saved={done:[],streak:0};store();render()}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang="en-US";r.interimResults=false;r.onstart=()=>{$("#wave").classList.remove("hidden");$("#mic").textContent="STOP"};r.onend=()=>{$("#wave").classList.add("hidden");$("#mic").textContent="MIC"};r.onresult=e=>{$("#input").value=e.results[0][0].transcript;answer()};$("#mic").onclick=()=>{try{r.start()}catch(e){r.stop()}}}else $("#mic").onclick=()=>alert("이 브라우저에서는 음성 인식을 지원하지 않습니다. 텍스트 입력을 사용해 주세요.");
